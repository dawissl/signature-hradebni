<table cellpadding="0" cellspacing="0" border="0"
style="font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a;width:500px;border-collapse:collapse;">

<tr>
<td colspan="3" style="padding-bottom:10px;border-bottom:2px solid #003163;">
  <span style="font-size:16px;font-weight:bold;color:#003163;display:block;margin-bottom:2px;">
    {{name}}
  </span>
  <span style="font-size:12px;color:#666666;">
    {{position}}
  </span>
</td>
</tr>

<tr><td colspan="3" style="height:12px;"></td></tr>

<tr>
<td style="vertical-align:middle;padding-right:20px;border-right:1px solid #e0e0e0;">
  <!-- sem necháš tvoje logo/base64 -->
</td>

<td style="padding-left:20px;">
  <div>📞 {{phone}}</div>
  <div>✉️ <a href="mailto:{{email}}">{{email}}</a></div>
</td>
</tr>

</table>
