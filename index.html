<!DOCTYPE html>
<html lang="cs">
   <head>
      <meta charset="UTF-8">
      <title>Generátor e-mailového podpisu</title>
      <link rel="stylesheet" href="style.css">
   </head>
   <body>
     <h1>Generátor podpisu</h1>
      <div class="container">
         <div class="form">
            <label>Jméno</label>
            <input id="name" type="text" placeholder="Jan Novák">
            <label>Pozice</label>
            <input id="position" type="text" placeholder="Učitel odborných předmětů">
            <label>Telefon</label>
            <input id="phone" type="text" placeholder="+420 123 456 789">
            <label>Email</label>
            <input id="email" type="text" placeholder="email@skola.cz">
            <button onclick="generate()">Vygenerovat</button>
            <button onclick="copySignature()">Kopírovat podpis</button>
         </div>
         <div class="preview">
            <div id="signature"></div>
         </div>
      </div>
      <p class="hint">
         Postup: Klikni na „Kopírovat podpis“ → otevři Gmail → vlož (Ctrl+V)
      </p>
      <script src="script.js"></script>
   </body>
</html>
